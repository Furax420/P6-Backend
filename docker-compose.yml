services:
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: mongodb://mongodb:27017/workshopsdb
    ports:
      - "127.0.0.1:8080:3000"
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
